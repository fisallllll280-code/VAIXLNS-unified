name: Innovative Wallet Tests

on:
  pull_request:
    paths:
      - "wallet/**"
      - "tests/test_innovative_wallet.py"
      - ".github/workflows/wallet-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "wallet/**"
      - "tests/test_innovative_wallet.py"
      - ".github/workflows/wallet-tests.yml"

permissions:
  contents: read

jobs:
  wallet-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run wallet ledger tests
        run: python -m pytest -q tests/test_innovative_wallet.py
