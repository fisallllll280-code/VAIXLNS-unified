name: VX Sovereign Engineering Core

on:
  pull_request:
    branches: [main]
    paths:
      - "vx/sovereign_engineering_core.py"
      - "tests/test_vx_sovereign_engineering_core.py"
      - ".github/workflows/vx-sovereign-engineering-core.yml"
  push:
    branches: ["feat/vx-sovereign-engineering-core-v1"]
    paths:
      - "vx/sovereign_engineering_core.py"
      - "tests/test_vx_sovereign_engineering_core.py"
      - ".github/workflows/vx-sovereign-engineering-core.yml"

permissions:
  contents: read

jobs:
  sovereign-engineering-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run VX Sovereign Engineering Core tests
        run: python -m unittest discover -s tests -p 'test_vx_sovereign_engineering_core.py' -v
