name: VAIXLNS Unified Verification

on:
  push:
    branches: ["main", "integration/**", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Federated boot smoke
        run: python main.py
      - name: Innovation Control self-adversarial gate
        run: python -m innovation_control.self_test
      - name: Self-discovery kernel gate
        run: python -m unittest tests.test_self_discovery -v
      - name: External integration boundary tests
        run: python -m pytest -q tests/test_external_integration_control.py
      - name: Research-to-engineering decision fabric tests
        run: python -m unittest discover -s tests -p "test_research_fabric.py" -v
      - name: Governed execution tool tests
        run: python -m unittest discover -s tests -p "test_execution_fabric.py" -v
      - name: Read-only research adapter tests
        run: python -m unittest discover -s tests -p "test_research_adapters.py" -v
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Full smoke cycle
        run: python -m scripts.vaixlns_smoke
