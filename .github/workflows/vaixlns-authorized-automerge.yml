name: VAIXLNS authorized auto-remediation

# SECURITY: pull_request_target runs the trusted base-branch workflow.
# Never checkout or execute PR-head code in this workflow.
on:
  pull_request_target:
    types: [labeled, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vaixlns-authorized-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  authorize-and-enable-automerge:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'vaixlns-authorized')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Enable merge only after required checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_URL" --auto --squash
