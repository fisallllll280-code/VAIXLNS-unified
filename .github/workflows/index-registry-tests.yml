name: Innovation Index Registry Tests

on:
  pull_request:
    paths:
      - "registry/**"
      - "tools/expand_index_bundle.py"
      - "tests/test_innovation_index_registry.py"
      - ".github/workflows/index-registry-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "registry/**"
      - "tools/expand_index_bundle.py"
      - "tests/test_innovation_index_registry.py"
      - ".github/workflows/index-registry-tests.yml"

permissions:
  contents: read

jobs:
  index-registry-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Validate consolidated registries
        run: python -m pytest -q tests/test_innovation_index_registry.py
